# ============================================================
# Navi · fnOS 应用包内的 Compose 编排（由飞牛应用中心按 docker-project 资源启动）
#
# 三个关键点：
#   ① 镜像用「固定版本标签」，不用 latest —— 标签可与 fpk 的版本号一一对应，
#      出问题时能一眼看出装的是哪一版；想升级就换 fpk。
#   ② 容器名 navi-fnos 与手动部署用的 navi 区分开 —— 两者可以并存，不会撞名。
#   ③ 数据目录挂在 ${TRIM_PKGVAR}（应用运行时数据目录）而不是包内 ——
#      升级/重装 fpk 不会碰它，卸载时也由系统决定是否保留。
#
# ── 用户输入为什么不走 env_file（v1.1.1 三次安装事故的最终结论） ──────────
# compose 对 env_file 是**硬依赖**：文件不在，直接报
#   `env file /vol1/@appdata/navi/navi.env not found`，整包回滚。
# 而「提前把文件写出来」的每一个时机都赶不上，这是实测得出的顺序：
#
#   install_init  ← 跑得最早，但此时 @appdata/<app> 尚未创建/授权
#                   （实测轨迹：pkgvar=/vol1/@appdata/navi pkgvar_writable=no）
#        ↓
#   飞牛拉起 docker-project（compose）  ← 失败就回滚，后面两步根本没机会跑
#        ↓
#   install_callback / cmd/main start   ← 都在 compose 之后，永远来不及
#
# 证据：/tmp/navi-lifecycle.log 里只有 install_init 的行，install_callback
# 与 cmd/main 的行一行都没有 —— 它们在回滚前就没被调用过。
#
# 改成把向导字段**直接经 compose 变量插值**注入。飞牛确实把环境变量交给了
# docker compose —— 上面那句报错里的 `${TRIM_PKGVAR}` 已被正确展开为
# `/vol1/@appdata/navi`，这就是实证。
#
# ⚠️ 变量未定义时 `${VAR:-}` 会得到**空串**。空密码意味着 server.js 开放访问，
# 所以 cmd/install_callback 仍会把向导值写一份到 ${TRIM_PKGVAR}/navi.env
# （给"以后时机变了"或手动部署留通路），而本文件不再依赖它。
# ============================================================
services:
  navi:
    image: ghcr.io/damisunshine/navi-homepage:1.1.1
    container_name: navi-fnos
    restart: unless-stopped

    # ⚠️ 这里**刻意不写 env_file**：它对 compose 是硬依赖，缺文件＝安装失败。
    #    用户输入改由下面的 environment 变量插值注入，零文件依赖。
    environment:
      # ── 用户输入（向导字段，飞牛以环境变量形式交给 docker compose） ──
      - NAVI_PASSWORD=${wizard_navi_password:-}
      - NAVI_USERNAME=${wizard_navi_username:-}
      - SITE_TITLE=${wizard_navi_site_title:-}
      - SITE_SUBTITLE=${wizard_navi_site_subtitle:-}
      - NAVI_LAN_HOST=${wizard_navi_lan_host:-}
      # ── 固定项：把"写文件"从镜像内置目录迁到挂载的数据目录（可持久化） ──
      - NAVI_CONFIG_PATH=/app/data/config.json
      - NAVI_UPLOAD_DIR=/app/data/uploads
      # 服务发现：读取 Docker Socket 自动识别容器并生成卡片
      - DOCKER_SOCKET=/var/run/docker.sock
      # 登录会话有效期（小时）
      - SESSION_TTL_HOURS=72

    ports:
      # 宿主机端口来自 manifest 的 service_port（8080），容器内固定监听 80
      - "${TRIM_SERVICE_PORT}:80"

    volumes:
      # 数据目录：config.json + uploads（唯一不可再生的数据，务必随升级保留）
      - ${TRIM_PKGVAR}/data:/app/data
      # 服务发现所需的 Docker Socket（只读）。
      # ⚠️ 挂载后容器获得等价于宿主机 root 的 Docker 控制权，仅建议在可信内网使用。
      #    不需要服务发现 / 首页状态板的「Docker 服务」计数时，把下面这行注释掉即可：
      #    站点其余功能完全不受影响（状态板会如实降级，而不是显示 0）。
      - /var/run/docker.sock:/var/run/docker.sock:ro
