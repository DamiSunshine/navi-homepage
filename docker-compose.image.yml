# ============================================================
# Navi · 纯拉取模式（不构建，直接用预构建镜像）
#
#   适用：目标机器不想/不能构建镜像时使用。
#   镜像由 GitHub Actions 在每次打 tag 时自动构建并推送到 GHCR
#   （见 .github/workflows/docker-publish.yml），支持 amd64 与 arm64。
#
#   用法（与 docker-compose.yml 是「二选一」的关系，靠 -f 切换）：
#     ① 首次初始化数据目录（见下方"首次初始化"，只需做一次）
#     ② docker compose -f docker-compose.image.yml pull     # 先取最新镜像
#     ③ docker compose -f docker-compose.image.yml up -d
#
#   ★ 首次初始化：宿主机 data/config.json 必须先存在，
#     因为 ./data:/app/data 会遮住镜像内置的示例配置，缺文件会让服务启动即失败。
#       mkdir -p data
#       docker run --rm ghcr.io/mijunyi/navi-homepage:latest \
#         cat /app/data/config.json > data/config.json
#     或直接从源码仓库取示例：cp public/config.example.json data/config.json
#
#   本文件必须是「无 build: 键」的 —— 有 build: 时 compose 会去构建，
#   就回到了源码构建那条路。scripts/check-compose.cjs 会强制校验这一点。
# ============================================================
services:
  navi:
    # 镜像地址可用环境变量覆盖：
    #   NAVI_IMAGE  —— 换用 GHCR 镜像站 / 自建代理时很有用（国内直连 ghcr.io 常不通）
    #   NAVI_TAG    —— 固定版本（如 1.2.3）可避免 latest 漂移
    # 例：NAVI_IMAGE=ghcr.nju.edu.cn/mijunyi/navi-homepage docker compose -f ... up -d
    image: ${NAVI_IMAGE:-ghcr.io/mijunyi/navi-homepage}:${NAVI_TAG:-latest}
    container_name: navi
    restart: unless-stopped
    # 想让每次 up 都去远端核对一次镜像，可取消下面这行注释。
    # 默认策略下 Docker 会复用本地已有镜像，:latest 就可能在不知不觉中变旧 ——
    # 所以更推荐用上面的 `docker compose pull` 显式升级。
    # pull_policy: always
    environment:
      # 可选：覆盖站点标题 / 副标题（仅展示层生效，不写回配置）
      - SITE_TITLE=dami
      - SITE_SUBTITLE=个人导航站
      # 访问密码保护（暴露公网务必设置！为空会导致认证被关闭）
      # 真实密码写在项目根目录的 .env（已被 .gitignore / .dockerignore 排除），
      # 此处用 :? 语法强制校验：缺少该变量时 compose 直接报错退出，
      # 不会静默变成「无密码开放访问」。
      - NAVI_PASSWORD=${NAVI_PASSWORD:?NAVI_PASSWORD is required, please set it in .env}
      # 登录用户名（取消注释并设置后，登录必须同时输入正确的用户名 + 密码；不设则仅用密码）
      # - NAVI_USERNAME=admin
      # 更推荐改用哈希（生成方式见 README），并删除明文密码那一行：
      # - NAVI_PASSWORD_HASH=你的sha256哈希
      # 会话有效期（小时），默认 72
      - SESSION_TTL_HOURS=72
      # 数据目录：把"写文件"从镜像内置目录迁移到挂载的 /app/data（可写、可持久化）
      - NAVI_CONFIG_PATH=/app/data/config.json
      - NAVI_UPLOAD_DIR=/app/data/uploads
      # ---- 服务发现（可选）----
      # 挂载 /var/run/docker.sock 后启用「自动识别容器 + 匹配图标 + 生成卡片」
      # 注意：socket 会让容器拥有等价于宿主机 root 的 Docker 控制权，
      #      仅在可信环境开启；不挂载则自动退化为扫描本机监听端口。
      # - DOCKER_SOCKET=/var/run/docker.sock
      # 内网 / 外网地址基址（不设则自动探测；外网不设时用内网地址兜底）
      # - NAVI_LAN_HOST=192.168.1.10
      # - NAVI_WAN_HOST=nav.example.com
      # 离线环境建议关闭图标在线探测，加快扫描速度
      # - NAVI_ICON_PROBE=0
      # 首页状态板（容器数 / CPU / 内存 / 磁盘水位，30s 轮询）
      # 设为 0 整体关闭；NAVI_STATUS_TTL 是服务端缓存时长（毫秒）
      # - NAVI_STATUS_BOARD=1
      # - NAVI_STATUS_TTL=5000
    ports:
      # IPv4 + IPv6 双栈发布（Docker 默认即绑定双栈，若宿主机启用了 IPv6 会同时监听 :::8080）
      - "8080:80"
    volumes:
      # 整目录挂载（关键！）：改为挂载整个数据目录而非单个 config.json。
      # 单文件挂载下写配置会走"跨挂载点 rename"，在部分平台（如飞牛 NAS）触发
      # EBUSY/EXDEV 保存失败；整目录挂载 rename 发生在同一挂载点内，天然规避此问题。
      # 首次启动前请确保宿主机 data/config.json 已存在（见文件头「首次初始化」）。
      - ./data:/app/data
      # 服务发现所需的 Docker Socket（可选，按需取消注释；见上方安全提示）
      # - /var/run/docker.sock:/var/run/docker.sock:ro
